name: Build Fofita - Windows

on:
  push:
    branches: [main, "setup/**", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libgl-dev
      - name: Testes sem GPU com AddressSanitizer e UBSan
        env:
          EXTRA_CFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=all
          ASAN_OPTIONS: detect_leaks=0
        run: bash tests/run_unit.sh

  avisos-licenca:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Obter fonte fixada do librashader
        run: |
          git clone --depth 1 --branch librashader-v0.12.0 \
            https://github.com/SnowflakePowered/librashader "$RUNNER_TEMP/librashader"
      - name: Gerar avisos de licenca
        run: |
          python3 tools/gerar_avisos_librashader.py "$RUNNER_TEMP/librashader" avisos
      - uses: actions/upload-artifact@v4
        with:
          name: avisos-librashader
          path: avisos/
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: [testes-linux, avisos-licenca]
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar compilador e SDL2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-sdl3
            curl
            unzip
            zip

      - name: Obter avisos de licenca
        uses: actions/download-artifact@v4
        with:
          name: avisos-librashader
          path: avisos

      - name: Testes sem GPU (Windows)
        run: bash tests/run_unit.sh

      - name: Compilar Fofita
        run: |
          set -euo pipefail
          gcc -std=gnu11 -O2 -Wall -Wextra -o Fofita.exe ./*.c \
            $(pkg-config --cflags --libs sdl2 SDL2_image) -lopengl32 -lm
          test -s Fofita.exe

      - name: Montar pacote Windows com bibliotecas
        run: |
          set -euo pipefail
          mkdir -p dist/Fofita
          cp Fofita.exe dist/Fofita/

          # librashader: versao fixa, SHA-256 conferido, com avisos de licenca.
          bash tools/obter_librashader.sh dist/Fofita
          mkdir -p dist/Fofita/licenses/librashader
          cp avisos/* dist/Fofita/licenses/librashader/
          cp -a shaders dist/Fofita/
          for file in shaders/fofita_teste/fofita_teste.slangp \
                      licenses/librashader/librashader-MPL-2.0.md \
                      licenses/librashader/THIRD_PARTY_NOTICES.txt \
                      licenses/librashader/LEIA-ME-librashader.txt; do
            test -s "dist/Fofita/$file" || { echo "::error::Ausente no pacote: $file"; exit 1; }
          done

          for folder in ui assets labels templates cores; do
            if [ -d "$folder" ]; then cp -a "$folder" dist/Fofita/; fi
          done

          # Pastas vazias nao sao preservadas pelo Git. Criar pasta de ROMs
          # para testes locais, sem distribuir jogos de terceiros.
          mkdir -p dist/Fofita/roms/{nes,gb,gbc}
          printf 'Coloque suas ROMs .nes nesta pasta para testa-las.\n' > dist/Fofita/roms/nes/LEIA-ME.txt
          printf 'ROMs .gb ou .dmg; instale gambatte_libretro.dll em cores/.\n' > dist/Fofita/roms/gb/LEIA-ME.txt
          printf 'ROMs .gbc; instale gambatte_libretro.dll em cores/.\n' > dist/Fofita/roms/gbc/LEIA-ME.txt

          # Nao publicar arquivos de estilo antigos nem presets incompletos.
          # Os 18 PNGs canonicos sao obrigatorios neste pacote.
          for preset in light dark colorful; do
            for name in trophy settings filter heart bucket out; do
              file="dist/Fofita/ui/styles/$preset/icons/${name}_icon_$preset.png"
              if [ ! -s "$file" ]; then
                echo "::error::Icone obrigatorio nao encontrado: $file"
                exit 1
              fi
            done
          done
          while IFS= read -r antigo; do
            echo "::error::Arquivo legado de icone no pacote: $antigo"
            exit 1
          done < <(find dist/Fofita/ui/styles -path '*/icons/*_icon.png' -type f)

          # Dependencias PE/Windows (nao usar ldd: ele pode nao encontrar
          # DLLs quando o EXE e analisado no ambiente MSYS2).
          # Percorre tambem as dependencias das DLLs copiadas e dos cores.
          queue=(Fofita.exe dist/Fofita/librashader.dll)
          while IFS= read -r -d '' core; do
            queue+=("$core")
          done < <(find dist/Fofita/cores -type f -iname '*.dll' -print0 2>/dev/null || true)

          # sdl2-compat carrega SDL3.dll via LoadLibrary em tempo de execucao.
          # A DLL nao aparece na tabela de imports PE: inclui-la explicitamente
          # quando a SDL2 instalada e a camada de compatibilidade.
          if grep -aFq 'SDL3.dll' /mingw64/bin/SDL2.dll || \
             grep -aFq 'Failed loading SDL3 library' /mingw64/bin/SDL2.dll; then
            test -s /mingw64/bin/SDL3.dll || {
              echo "::error::SDL2-compat detectado, mas SDL3.dll nao foi encontrado"
              exit 1
            }
            cp /mingw64/bin/SDL3.dll dist/Fofita/SDL3.dll
            queue+=(/mingw64/bin/SDL3.dll)
            echo "Incluida SDL3.dll: dependencia dinamica do sdl2-compat"
          fi

          index=0
          while (( index < ${#queue[@]} )); do
            current="${queue[$index]}"
            index=$((index+1))
            while IFS= read -r dll; do
              [ -n "$dll" ] || continue
              # Apenas bibliotecas fornecidas pelo MinGW; nunca empacotar DLLs do Windows.
              source=$(find /mingw64/bin -maxdepth 1 -type f -iname "$dll" -print -quit)
              if [ -n "$source" ]; then
                name="${source##*/}"
                if [ ! -f "dist/Fofita/$name" ]; then
                  cp "$source" "dist/Fofita/$name"
                  queue+=("$source")
                  echo "Incluida dependencia: $name"
                fi
              fi
            done < <(objdump -p "$current" | sed -n 's/^[[:space:]]*DLL Name: //p')
          done

          # O Fofita importa diretamente estas duas bibliotecas.
          for dll in SDL2.dll SDL2_image.dll; do
            test -s "dist/Fofita/$dll" || {
              echo "::error::Biblioteca obrigatoria ausente: $dll"
              exit 1
            }
          done
          test -s dist/Fofita/Fofita.exe
          # O build nao e considerado pronto se sdl2-compat estiver sem seu backend.
          if grep -aFq 'SDL3.dll' dist/Fofita/SDL2.dll || \
             grep -aFq 'Failed loading SDL3 library' dist/Fofita/SDL2.dll; then
            test -s dist/Fofita/SDL3.dll || {
              echo "::error::SDL3.dll ausente do pacote"
              exit 1
            }
          fi
          echo "Imports de librashader.dll:"
          objdump -p dist/Fofita/librashader.dll | sed -n 's/^[[:space:]]*DLL Name: /  /p'
          # O OpenGL deve ser o do driver do usuario, nunca um renderizador por software.
          test ! -e dist/Fofita/opengl32.dll || { echo "::error::opengl32.dll nao pode ser distribuida"; exit 1; }
          echo "Pacote final preparado:"
          find dist/Fofita -maxdepth 1 -type f -printf '%f\n' | sort

      # Instalado somente depois do pacote pronto, para nunca entrar nele.
      - name: Instalar OpenGL por software (somente testes)
        run: pacman -S --noconfirm --needed mingw-w64-x86_64-mesa

      - name: Testes de GPU com a librashader.dll do pacote (Mesa llvmpipe)
        timeout-minutes: 10
        env:
          GALLIUM_DRIVER: llvmpipe
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          # Copia do pacote final + executaveis de teste + Mesa.
          rm -rf build/gpu && mkdir -p build/gpu/tmp
          cp -a dist/Fofita/. build/gpu/
          FLAGS="-std=gnu11 -O1 -g -Wall -Wextra -Werror"
          SDL="$(pkg-config --cflags sdl2 SDL2_image) $(pkg-config --libs sdl2 SDL2_image | sed 's/-mwindows//; s/-lSDL2main//; s/-Dmain=SDL_main//')"
          gcc $FLAGS tests/test_gpu.c game_video.c video_math.c shader_manager.c slang_backend.c \
            -o build/gpu/test_gpu.exe $SDL -lopengl32 -lm
          gcc -std=gnu11 -O1 -g -Wall tests/test_core_nes.c game_video.c video_math.c shader_manager.c \
            slang_backend.c video_audio.c libretro_core.c input.c \
            -o build/gpu/test_core_nes.exe $SDL -lopengl32 -lm
          queue=(/mingw64/bin/opengl32.dll)
          cp /mingw64/bin/opengl32.dll build/gpu/
          index=0
          while (( index < ${#queue[@]} )); do
            current="${queue[$index]}"; index=$((index+1))
            while IFS= read -r dll; do
              source=$(find /mingw64/bin -maxdepth 1 -type f -iname "$dll" -print -quit)
              if [ -n "$source" ] && [ ! -f "build/gpu/${source##*/}" ]; then
                cp "$source" build/gpu/; queue+=("$source")
              fi
            done < <(objdump -p "$current" | sed -n 's/^[[:space:]]*DLL Name: //p')
          done

          cd build/gpu
          executados=0
          for driver in software opengl direct3d11 direct3d; do
            echo "::group::test_gpu ($driver)"
            codigo=0
            ./test_gpu.exe "$driver" "$(cygpath -m "$PWD/librashader.dll")" \
              "$(cygpath -m "$PWD/shaders/fofita_teste/fofita_teste.slangp")" tmp || codigo=$?
            echo "::endgroup::"
            if [ "$codigo" = 0 ]; then
              executados=$((executados+1))
            elif [ "$codigo" = 77 ] && [ "$driver" != software ] && [ "$driver" != opengl ]; then
              echo "::warning::Renderer $driver indisponivel no runner; nao testado"
            else
              echo "::error::test_gpu falhou com $driver (codigo $codigo)"; cat fofita_shader.log || true; exit 1
            fi
          done
          echo "Renderers testados: $executados"
          echo "::group::test_core_nes"
          ./test_core_nes.exe tmp || { cat fofita_shader.log || true; exit 1; }
          echo "::endgroup::"

      - name: Publicar pacote para download (ZIP unico)
        uses: actions/upload-artifact@v4
        with:
          name: Fofita-Windows
          path: dist/
          if-no-files-found: error
          retention-days: 14
