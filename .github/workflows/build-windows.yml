name: Build Fofita - Windows

on:
  push:
    branches: [main, "setup/**", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar compilador e SDL2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-sdl3
            zip

      - name: Compilar Fofita
        run: |
          set -euo pipefail
          gcc -std=gnu11 -O2 -Wall -Wextra -o Fofita.exe ./*.c \
            $(pkg-config --cflags --libs sdl2 SDL2_image) -lm
          test -s Fofita.exe

      - name: Testar estado da sessao (B0, sem SDL)
        run: |
          set -euo pipefail
          gcc -std=gnu11 -O2 -Wall -Wextra -Werror -o b0-session-test.exe \
            game_session.c tests/test_game_session.c
          ./b0-session-test.exe

      - name: Testar carregamento e diretorios Libretro (B1)
        run: |
          set -euo pipefail
          gcc -std=gnu11 -O2 -Wall -Wextra -Werror -o b1-content-test.exe \
            core_content.c tests/test_core_content.c
          ./b1-content-test.exe
          gcc -std=gnu11 -O2 -Wall -Wextra -Werror -o b1-paths-test.exe \
            core_paths.c tests/test_core_paths.c
          ./b1-paths-test.exe

      - name: Testar registro de GB e GBC (B1.2)
        run: |
          set -euo pipefail
          gcc -std=gnu11 -O2 -Wall -Wextra -Werror -o b12-registry-test.exe \
            console_registry.c tests/test_console_registry.c
          ./b12-registry-test.exe

      - name: Testar fallback de cartao digital (GB/GBC)
        run: |
          set -euo pipefail
          gcc -std=gnu11 -O2 -Wall -Wextra -Werror -o b12-game-view-test.exe \
            ui_game_view.c tests/test_game_view.c
          ./b12-game-view-test.exe

      - name: Testar ambiente Gambatte (B1.2, GET_CAN_DUPE)
        run: |
          set -euo pipefail
          gcc -std=gnu11 -O2 -Wall -Wextra -o gambatte-env-test.exe \
            libretro_core.c core_content.c core_paths.c save_manager.c tests/test_core_environment.c \
            $(pkg-config --cflags --libs sdl2 SDL2_image)
          ./gambatte-env-test.exe

      - name: Testar SRAM persistente (B2.1)
        run: |
          set -euo pipefail
          gcc -std=gnu11 -O2 -Wall -Wextra -Werror -o b21-sram-test.exe \
            save_manager.c tests/test_save_manager.c
          ./b21-sram-test.exe

      - name: Testar comandos do controle sem interferir no jogo
        run: |
          set -euo pipefail
          gcc -std=gnu11 -O2 -Wall -Wextra -Werror -o input-rules-test.exe \
            input_rules.c tests/test_input_rules.c $(pkg-config --cflags --libs sdl2)
          ./input-rules-test.exe

      - name: Testar remapeamento e persistencia dos controles
        run: |
          set -euo pipefail
          gcc -std=gnu11 -O2 -Wall -Wextra -Werror -o input-bindings-test.exe \
            input_bindings.c tests/test_input_bindings.c \
            $(pkg-config --cflags --libs sdl2)
          ./input-bindings-test.exe

      - name: Testar pulsos de entrada rapidos (menus Pokemon/Zelda)
        run: |
          set -euo pipefail
          gcc -std=gnu11 -O2 -Wall -Wextra -Werror -o input-latch-test.exe \
            input_latch.c tests/test_input_latch.c $(pkg-config --cflags --libs sdl2)
          timeout 20s ./input-latch-test.exe

      - name: Montar pacote Windows com bibliotecas
        run: |
          set -euo pipefail
          mkdir -p dist/Fofita
          cp Fofita.exe dist/Fofita/

          for folder in ui assets labels templates cores; do
            if [ -d "$folder" ]; then cp -a "$folder" dist/Fofita/; fi
          done

          # Pastas vazias nao sao preservadas pelo Git. Criar pasta de ROMs
          # para testes locais, sem distribuir jogos de terceiros.
          mkdir -p dist/Fofita/roms/{nes,gb,gbc}
          printf 'Coloque suas ROMs .nes nesta pasta para testa-las.\n' > dist/Fofita/roms/nes/LEIA-ME.txt
          printf 'Coloque suas ROMs .gb ou .dmg nesta pasta e instale gambatte_libretro.dll em cores/.\n' > dist/Fofita/roms/gb/LEIA-ME.txt
          printf 'Coloque suas ROMs .gbc nesta pasta e instale gambatte_libretro.dll em cores/.\n' > dist/Fofita/roms/gbc/LEIA-ME.txt

          # Nao publicar arquivos de estilo antigos nem presets incompletos.
          # Os 18 PNGs canonicos sao obrigatorios neste pacote.
          for preset in light dark colorful; do
            for name in trophy settings filter heart bucket out; do
              file="dist/Fofita/ui/styles/$preset/icons/${name}_icon_$preset.png"
              if [ ! -s "$file" ]; then
                echo "::error::Icone obrigatorio nao encontrado: $file"
                exit 1
              fi
            done
          done
          while IFS= read -r antigo; do
            echo "::error::Arquivo legado de icone no pacote: $antigo"
            exit 1
          done < <(find dist/Fofita/ui/styles -path '*/icons/*_icon.png' -type f)

          # Dependencias PE/Windows (nao usar ldd: ele pode nao encontrar
          # DLLs quando o EXE e analisado no ambiente MSYS2).
          # Percorre tambem as dependencias das DLLs copiadas e dos cores.
          queue=(Fofita.exe)
          while IFS= read -r -d '' core; do
            queue+=("$core")
          done < <(find dist/Fofita/cores -type f -iname '*.dll' -print0 2>/dev/null || true)

          # sdl2-compat carrega SDL3.dll via LoadLibrary em tempo de execucao.
          # A DLL nao aparece na tabela de imports PE: inclui-la explicitamente
          # quando a SDL2 instalada e a camada de compatibilidade.
          if grep -aFq 'SDL3.dll' /mingw64/bin/SDL2.dll || \
             grep -aFq 'Failed loading SDL3 library' /mingw64/bin/SDL2.dll; then
            test -s /mingw64/bin/SDL3.dll || {
              echo "::error::SDL2-compat detectado, mas SDL3.dll nao foi encontrado"
              exit 1
            }
            cp /mingw64/bin/SDL3.dll dist/Fofita/SDL3.dll
            queue+=(/mingw64/bin/SDL3.dll)
            echo "Incluida SDL3.dll: dependencia dinamica do sdl2-compat"
          fi

          index=0
          while (( index < ${#queue[@]} )); do
            current="${queue[$index]}"
            index=$((index+1))
            while IFS= read -r dll; do
              [ -n "$dll" ] || continue
              # Apenas bibliotecas fornecidas pelo MinGW; nunca empacotar DLLs do Windows.
              source=$(find /mingw64/bin -maxdepth 1 -type f -iname "$dll" -print -quit)
              if [ -n "$source" ]; then
                name="${source##*/}"
                if [ ! -f "dist/Fofita/$name" ]; then
                  cp "$source" "dist/Fofita/$name"
                  queue+=("$source")
                  echo "Incluida dependencia: $name"
                fi
              fi
            done < <(objdump -p "$current" | sed -n 's/^[[:space:]]*DLL Name: //p')
          done

          # O Fofita importa diretamente estas duas bibliotecas.
          for dll in SDL2.dll SDL2_image.dll; do
            test -s "dist/Fofita/$dll" || {
              echo "::error::Biblioteca obrigatoria ausente: $dll"
              exit 1
            }
          done
          test -s dist/Fofita/Fofita.exe
          # O build nao e considerado pronto se sdl2-compat estiver sem seu backend.
          if grep -aFq 'SDL3.dll' dist/Fofita/SDL2.dll || \
             grep -aFq 'Failed loading SDL3 library' dist/Fofita/SDL2.dll; then
            test -s dist/Fofita/SDL3.dll || {
              echo "::error::SDL3.dll ausente do pacote"
              exit 1
            }
          fi
          echo "Pacote final preparado:"
          find dist/Fofita -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Publicar pacote para download (ZIP unico)
        uses: actions/upload-artifact@v4
        with:
          name: Fofita-Windows
          path: dist/
          if-no-files-found: error
          retention-days: 14
